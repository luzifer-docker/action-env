name: Docker Publish

on:
  push:
    branches: [master]
    tags: ['*']
    paths:
      - 'Dockerfile'
      - 'rootfs/**'
  workflow_dispatch: {}

jobs:
  docker-publish:
    defaults:
      run:
        shell: bash

    runs-on: forgejo

    steps:
      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: luzifer
          password: ${{ secrets.GHCR_PASSWORD }}

      - uses: luzifer/actions/docker-publish@207fd028b122b60f8218cbfff0cb7401d55f29a1 # develop
        with:
          image: |
            git.luzifer.io/registry/action-env
            ghcr.io/luzifer-docker/action-env
          password: ${{ secrets.REGISTRY_TOKEN }}
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          registry: git.luzifer.io
