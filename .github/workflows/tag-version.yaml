name: Tag Version

on:
  schedule:
    - cron: '0 4 * * 6'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  tag-version:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/luzifer-docker/action-env:2026.37.0@sha256:0761a59a47232579d833dcdf7878a2e49be4a84e26b45d6e1a24acc0424b8774

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Log into registry
        run: skopeo login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag version
        run: bash ci/tag-version.sh
