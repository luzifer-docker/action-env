name: Tag Version

on:
  schedule:
    - cron: '0 4 * * 6'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  tag-version:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/luzifer-docker/action-env:2026.48.0@sha256:4a0f149906bbf42a650f0f12c26f0593f396d209c08e36d9e79458b4c7e2dc2e

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Log into registry
        run: skopeo login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag version
        run: bash ci/tag-version.sh
